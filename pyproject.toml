[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-screening-engine"
version = "0.1.0"
description = "Evidence-backed resume screening with an offline engine and persistent backend"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.10", "httpx==0.28.1", "build==1.6.1"]
# Cross-encoder reranker for semantic_relevance (SEMANTIC_RERANKER=bge-reranker-v2-m3). Pulls in torch.
# >=4.0: CrossEncoder.predict(activation_fn=...) (named activation_fct before 4.0).
rerank = ["sentence-transformers>=4.0"]
# LambdaMART (LightGBM) vs logistic-regression comparison on the golden set (eval only, never scoring).
ltr = ["lightgbm==4.7.0"]
training = ["torch==2.9.1", "transformers==4.57.6", "peft==0.18.1", "accelerate==1.12.0"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["engine*", "api*", "backend*", "training*"]
namespaces = false

[tool.setuptools.package-data]
engine = ["skills_ontology.json", "similarity_calibration.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "live: calls the real Azure OpenAI API; skipped unless AZURE_OPENAI_ENDPOINT/API_KEY are set",
    "integration: requires explicit TEST_DATABASE_URL and TEST_DATABASE_SYSTEM_URL for local PostgreSQL",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", ".cache", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # intentional non-ASCII (dashes, bullets, Indic test strings)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B018"]
"eval/golden/generate_golden.py" = ["E501"]  # readable data table
